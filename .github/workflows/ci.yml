name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodcore_test
          POSTGRES_USER: foodcore_user
          POSTGRES_PASSWORD: foodcore_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodcore_user -d foodcore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Garantir permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Executar Build e Testes Automatizados
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/foodcore_test
          SPRING_DATASOURCE_USERNAME: foodcore_user
          SPRING_DATASOURCE_PASSWORD: foodcore_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: ./gradlew clean build --no-daemon