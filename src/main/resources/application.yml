server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: rm-tekton-food-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodcore_test}
    username: ${SPRING_DATASOURCE_USERNAME:foodcore_user}
    password: ${SPRING_DATASOURCE_PASSWORD:foodcore_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-hours: ${JWT_EXPIRATION_HOURS}
    pepper: ${SECURITY_PEPPER}
    cookie:
      secure: ${COOKIE_SECURE:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:5}
    write-requests-per-minute: ${RATE_LIMIT_WRITE_RPM:30}
    read-requests-per-minute: ${RATE_LIMIT_READ_RPM:100}